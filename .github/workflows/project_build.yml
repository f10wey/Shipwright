
###############################################################################

name: Project Build

###############################################################################

# Trigger the jobs on:
# - A pull request is opened or a new commit is added to the pull request
# - A new release is created or a release is edited
on:
  push:
    branches: [android-ru]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  release:
    types: [published, edited]

###############################################################################

# Jobs to run
jobs:

  # Build the project and upload Release APK to Github artifacts
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Restore signing key
        id: key
        uses: actions/cache/restore@v4
        with:
          path: keystore
          key: soh-ru-signing-key-v1

      - name: Create signing key (first run only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/soh-ru.keystore -alias soh \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass soh-ru-local -keypass soh-ru-local \
            -dname "CN=SoH RU, O=f10wey, C=UA"

      - name: Save signing key
        if: steps.key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: keystore
          key: soh-ru-signing-key-v1

      - name: Setup and build the project
        run: |
          cd docker
          make setup
          make build_release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            Android/app/build/outputs/apk/release/*.apk

