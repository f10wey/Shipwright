name: Publish builds as release
on:
  push:
    branches: [publish-builds]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: soh-windows
          run-id: 45489009631
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pc
      - name: Package
        run: |
          cp pc/soh.exe soh-ru-v3.exe
          cp pc/soh.o2r soh-ru-v3.o2r
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ru-builds
          name: Russian menu builds
          prerelease: true
          files: |
            soh-ru-v3.exe
            soh-ru-v3.o2r
