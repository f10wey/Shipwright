name: Publish builds as release
on:
  push:
    branches: [publish-builds]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          run-id: 45799699239
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: android
      - name: Package
        run: cp android/*.apk soh-android-ru-v11.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ru-builds
          name: Russian menu builds
          prerelease: true
          files: soh-android-ru-v11.apk
